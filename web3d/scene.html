<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>웹3D 씬 — 인덕션 튀김 냄비 과열·발화</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0d0d0d; color:#e8e8e6;
         font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
  #wrap { display:flex; height:100vh; }
  #view { flex:1; display:flex; align-items:center; justify-content:center; background:#111; }
  canvas { border:1px solid #2c2c2a; }
  #panel { width:308px; padding:18px; overflow-y:auto; background:#1a1a19;
           border-left:1px solid #2c2c2a; }
  h1 { font-size:15px; margin:0 0 4px; }
  .sub { font-size:12px; color:#898781; margin-bottom:16px; line-height:1.55; }
  label { display:block; font-size:12px; color:#c3c2b7; margin:13px 0 5px; }
  label b { color:#e8e8e6; float:right; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:#eb6834; }
  button { width:100%; padding:9px; margin-top:8px; font-size:13px; cursor:pointer;
           border:1px solid #3a3a38; background:#242422; color:#e8e8e6; border-radius:6px; }
  button:hover { background:#2e2e2b; }
  button.on { background:#eb6834; border-color:#eb6834; color:#fff; font-weight:600; }
  button.primary { background:#2a78d6; border-color:#2a78d6; font-weight:600; }
  button.primary:hover { background:#3987e5; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:6px; }
  .row button { margin-top:0; font-size:12px; padding:8px 4px; }
  hr { border:0; border-top:1px solid #2c2c2a; margin:16px 0; }
  #log { font-size:11px; color:#898781; margin-top:10px; line-height:1.6;
         white-space:pre-wrap; max-height:150px; overflow-y:auto; }
  .stagenote { font-size:11px; color:#898781; margin-top:6px; line-height:1.5; }
</style>
</head>
<body>
<div id="wrap">
  <div id="view"></div>
  <div id="panel">
    <h1>튀김 냄비 과열·발화</h1>
    <div class="sub">인덕션 조리대 위 튀김 냄비. 렌더 화면에서 화재 탐지가 되는지 확인하기 위한 씬.<br>캡처 960×540.</div>

    <label>화염 소스</label>
    <div class="row">
      <button id="m0" class="on">절차적(노이즈)</button>
      <button id="m1">실사 아틀라스</button>
    </div>
    <div class="stagenote" id="mnote">노이즈로 생성한 화염. 실사 픽셀 0장.</div>

    <label>단계</label>
    <div class="row">
      <button id="s0" class="on">정상 조리</button>
      <button id="s1">과열·연기</button>
      <button id="s2">발화</button>
    </div>
    <div class="stagenote" id="note">가스 불꽃만 있는 상태. 이걸 화재로 잡으면 오탐.</div>

    <label>화재 크기 <b id="v-fire">1.00</b></label>
    <input type="range" id="fire" min="0.25" max="1.7" step="0.01" value="1">

    <label>인덕션 출력 <b id="v-gas">1.00</b></label>
    <input type="range" id="gas" min="0.2" max="1.8" step="0.01" value="1">

    <label>카메라 방위 <b id="v-az">22°</b></label>
    <input type="range" id="az" min="-85" max="85" step="1" value="22">

    <label>카메라 높이 <b id="v-el">20°</b></label>
    <input type="range" id="el" min="3" max="62" step="1" value="20">

    <label>카메라 거리 <b id="v-di">2.5</b></label>
    <input type="range" id="di" min="1.2" max="5.0" step="0.05" value="2.5">

    <label>주방 조명 <b id="v-li">1.00</b></label>
    <input type="range" id="li" min="0.25" max="1.8" step="0.01" value="1">

    <hr>
    <button id="rnd">씬 무작위화 (벽·상판·냄비·조명·잡기물)</button>
    <button id="cap">이 화면 1장 캡처</button>
    <button class="primary" id="auto">자동 캡처</button>
    <div id="log">준비됨.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const W = 960, H = 540;
const log = m => { const l=document.getElementById('log'); l.textContent = m+"\n"+l.textContent; };

// ---------- 진단 ----------
const diagBox = document.createElement('div');
diagBox.style.cssText = 'position:fixed;left:0;top:0;right:308px;padding:14px 18px;'
  + 'background:#2a1414;border-bottom:2px solid #e34948;color:#ffd9d9;font-size:13px;'
  + 'line-height:1.7;z-index:9999;display:none;white-space:pre-wrap;font-family:monospace';
document.body.appendChild(diagBox);
function showErr(m){ diagBox.style.display='block'; diagBox.textContent += m + "\n"; }
window.addEventListener('error', e => showErr('오류: ' + (e.message || e.error)));
(function(){
  const L=[]; L.push('THREE: ' + (typeof THREE!=='undefined' ? 'OK r'+(THREE.REVISION||'?') : '로드 실패'));
  L.push('JSZip: ' + (typeof JSZip!=='undefined' ? 'OK' : '로드 실패'));
  let w='없음';
  try { const c=document.createElement('canvas');
        const gl=c.getContext('webgl2')||c.getContext('webgl');
        if(gl){ const d=gl.getExtension('WEBGL_debug_renderer_info');
                w='OK — '+(d?gl.getParameter(d.UNMASKED_RENDERER_WEBGL):'정보없음'); } }
  catch(e){ w='예외 '+e.message; }
  L.push('WebGL: '+w);
  if (L.some(x=>x.includes('실패')||x.includes('없음')||x.includes('예외'))) {
    diagBox.style.display='block'; diagBox.textContent = L.join('\n')+"\n";
  } else document.getElementById('log').textContent = L.join(' | ');
})();

try {

// ---------- 기본 ----------
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.getElementById('view').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101010);
const camera = new THREE.PerspectiveCamera(40, W/H, 0.05, 60);

const steel = (m,r,c)=> new THREE.MeshStandardMaterial({color:c||0xb9bdc1,metalness:m,roughness:r});

// ---------- 주방 ----------
// 바닥 · 타일 벽
const floor = new THREE.Mesh(new THREE.PlaneGeometry(12,12),
  new THREE.MeshStandardMaterial({color:0x878986,roughness:.88,metalness:.04}));
floor.rotation.x=-Math.PI/2; scene.add(floor);
function tileTex(){
  const s=256,c=document.createElement('canvas'); c.width=c.height=s; const x=c.getContext('2d');
  x.fillStyle='#e9ebe8'; x.fillRect(0,0,s,s);
  x.strokeStyle='#c9ccc8'; x.lineWidth=3;
  for(let i=0;i<=4;i++){ const p=i*s/4; x.beginPath(); x.moveTo(p,0); x.lineTo(p,s);
    x.moveTo(0,p); x.lineTo(s,p); x.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(5,3); return t;
}
const wall = new THREE.Mesh(new THREE.PlaneGeometry(12,5),
  new THREE.MeshStandardMaterial({map:tileTex(),roughness:.75,metalness:.03}));
wall.position.set(0,2.5,-1.35); scene.add(wall);

// 조리대
const counter = new THREE.Mesh(new THREE.BoxGeometry(3.0,0.9,1.1), steel(0.45,0.42,0xa9adb1));
counter.position.set(0,0.45,-0.7); scene.add(counter);
const cTop = new THREE.Mesh(new THREE.BoxGeometry(3.06,0.05,1.16), steel(0.78,0.2,0xcdd1d4));
cTop.position.set(0,0.925,-0.7); scene.add(cTop);

// 인덕션 상판 (검은 유리) + 화구 표시
const hobGlass = new THREE.Mesh(new THREE.BoxGeometry(1.15,0.022,0.78),
  new THREE.MeshStandardMaterial({color:0x121316, metalness:.35, roughness:.09}));
hobGlass.position.set(0,0.962,-0.7); scene.add(hobGlass);
const zone = new THREE.Mesh(new THREE.TorusGeometry(0.30,0.0035,8,60),
  new THREE.MeshStandardMaterial({color:0x8b8f93, metalness:.2, roughness:.6}));
zone.rotation.x=Math.PI/2; zone.position.set(0,0.974,-0.7); scene.add(zone);
const zone2 = new THREE.Mesh(new THREE.TorusGeometry(0.20,0.0030,8,50),
  new THREE.MeshStandardMaterial({color:0x6f7376, metalness:.2, roughness:.6}));
zone2.rotation.x=Math.PI/2; zone2.position.set(0,0.974,-0.7); scene.add(zone2);
// 잔열 표시 — 냄비 아래 은은한 붉은 기운
const heatMat = new THREE.MeshStandardMaterial({color:0x1a1416, emissive:0x000000,
  metalness:.3, roughness:.35, transparent:true, opacity:.92});
const heat = new THREE.Mesh(new THREE.CircleGeometry(0.255,40), heatMat);
heat.rotation.x=-Math.PI/2; heat.position.set(0,0.976,-0.7); scene.add(heat);

// 제어 패널 — 주황·빨강 LED (실제 주방의 오탐 유발 요소)
const cpanel = new THREE.Mesh(new THREE.BoxGeometry(0.44,0.10,0.02),
  new THREE.MeshStandardMaterial({color:0x17181a, metalness:.45, roughness:.35}));
cpanel.position.set(0,0.905,-0.19); cpanel.rotation.x=-0.25; scene.add(cpanel);
const leds=[];
for(let i=0;i<4;i++){
  const m=new THREE.MeshStandardMaterial({color:i<3?0xff7a18:0xff3b2f,
    emissive:i<3?0xff6a00:0xd42a1a, emissiveIntensity:1.0});
  const b=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.014,0.004), m);
  b.position.set(-0.12+i*0.08, 0.918, -0.178); b.rotation.x=-0.25; scene.add(b); leds.push(m);
}

// 튀김 냄비
const potMat = steel(0.72,0.28,0xc4c8cc);
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.26,0.24,40,1,true), potMat);
pot.position.set(0,1.10,-0.7); pot.material.side=THREE.DoubleSide; scene.add(pot);
const potBase = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.02,40), potMat);
potBase.position.set(0,0.99,-0.7); scene.add(potBase);
const potRim = new THREE.Mesh(new THREE.TorusGeometry(0.30,0.016,10,44), steel(0.8,0.22,0xd3d7da));
potRim.rotation.x=Math.PI/2; potRim.position.set(0,1.22,-0.7); scene.add(potRim);
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.075,0.014,8,20,Math.PI), steel(0.75,0.3));
handle.position.set(0.36,1.19,-0.7); handle.rotation.set(Math.PI/2,0,Math.PI/2); scene.add(handle);
// 기름 표면
const oilMat = new THREE.MeshStandardMaterial({color:0xbe912f,metalness:.32,roughness:.2});
const oil = new THREE.Mesh(new THREE.CylinderGeometry(0.285,0.285,0.012,40), oilMat);
oil.position.set(0,1.16,-0.7); scene.add(oil);
// 튀김 바구니 손잡이
const bh = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.34,10), steel(0.8,0.25));
bh.rotation.z=Math.PI/2.6; bh.position.set(-0.30,1.30,-0.55); scene.add(bh);

// 냄비 그룹 (크기 랜덤화용 · 인덕션 상판을 피벗으로 스케일)
const POT_PIVOT_Y = 0.974;
const potGroup = new THREE.Group();
potGroup.position.set(0, POT_PIVOT_Y, 0); scene.add(potGroup);
[pot, potBase, potRim, handle, oil, bh].forEach(m=>{ m.position.y -= POT_PIVOT_Y; potGroup.add(m); });
let potScale = 1;

// 좌우 벽 — 광각에서 검은 공백이 보이지 않도록
const wallMat2 = new THREE.MeshStandardMaterial({map:tileTex(), roughness:.8, metalness:.03});
const wallL = new THREE.Mesh(new THREE.PlaneGeometry(9,5), wallMat2);
wallL.position.set(-3.4,2.5,2.0); wallL.rotation.y=Math.PI/2; scene.add(wallL);
const wallR = new THREE.Mesh(new THREE.PlaneGeometry(9,5), wallMat2);
wallR.position.set(3.4,2.5,2.0); wallR.rotation.y=-Math.PI/2; scene.add(wallR);

// 잡기물 — 캡처마다 일부만 노출
const clutter = [];
(function(){
  const board = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.028,0.30),
    new THREE.MeshStandardMaterial({color:0xb99a6e, roughness:.85, metalness:.02}));
  board.position.set(-1.02,0.965,-0.72); clutter.push(board);
  const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.05,0.24,18),
    new THREE.MeshStandardMaterial({color:0x9aa7b2, roughness:.3, metalness:.15,
      transparent:true, opacity:.85}));
  bottle.position.set(0.86,1.07,-0.85); clutter.push(bottle);
  const tray = new THREE.Mesh(new THREE.BoxGeometry(0.40,0.05,0.28), steel(0.8,0.3,0xc7cbcf));
  tray.position.set(1.10,0.975,-0.55); clutter.push(tray);
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.048,0.11,18),
    new THREE.MeshStandardMaterial({color:0xe7e4dd, roughness:.6}));
  cup.position.set(-0.72,1.005,-0.42); clutter.push(cup);
  const pan = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.16,0.06,26), steel(0.7,0.35,0x8f9498));
  pan.position.set(-1.30,0.98,-0.50); clutter.push(pan);
  clutter.forEach(m=>{ m.visible=false; scene.add(m); });
})();

// ---------- 조명 ----------
const hemi=new THREE.HemisphereLight(0xdfe3e6,0x4a4c49,0.40); scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff4e6,0.62); key.position.set(2.2,4,2.6); scene.add(key);
const fill=new THREE.DirectionalLight(0xdce6f2,0.32); fill.position.set(-2.6,2.2,2.2); scene.add(fill);
const fireLight=new THREE.PointLight(0xff7b2a,0,5,2); fireLight.position.set(0,1.45,-0.7); scene.add(fireLight);

// ---------- 텍스처 ----------
function softTex(){
  const s=96,c=document.createElement('canvas'); c.width=c.height=s; const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,0.85)'); g.addColorStop(0.45,'rgba(255,255,255,0.30)');
  g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}
const TEX_S=softTex();

const LOADER = new THREE.TextureLoader();
let atlasLoaded = 0;
function newAtlasTex(){
  const t = LOADER.load(ATLAS_SRC,
    () => { if(++atlasLoaded===1) log('화염 아틀라스 로드 완료'); },
    undefined,
    () => showErr('화염 아틀라스 로드 실패'));
  t.magFilter = THREE.LinearFilter;
  t.minFilter = THREE.LinearFilter;
  t.generateMipmaps = false;
  t.encoding = THREE.sRGBEncoding;
  t.repeat.set(0.25, 0.25);
  return t;
}

// ---------- 파티클 ----------
const VS = `
attribute float psize; attribute float palpha; attribute vec3 pcolor;
varying vec3 vC; varying float vA;
void main(){ vC=pcolor; vA=palpha;
  vec4 mv = modelViewMatrix * vec4(position,1.0);
  gl_PointSize = psize * (742.0 / max(0.05,-mv.z));
  gl_Position = projectionMatrix * mv; }`;
const FS = `
uniform sampler2D map; varying vec3 vC; varying float vA;
void main(){ vec4 t = texture2D(map, gl_PointCoord);
  float a = t.a * vA; if(a<0.004) discard;
  gl_FragColor = vec4(vC, a); }`;

function mk(n,tex,blend){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  geo.setAttribute('pcolor', new THREE.BufferAttribute(new Float32Array(n*3),3));
  geo.setAttribute('psize',  new THREE.BufferAttribute(new Float32Array(n),1));
  geo.setAttribute('palpha', new THREE.BufferAttribute(new Float32Array(n),1));
  const mat=new THREE.ShaderMaterial({uniforms:{map:{value:tex}},
    vertexShader:VS, fragmentShader:FS, transparent:true, depthWrite:false,
    blending:blend, depthTest:true});
  const pts=new THREE.Points(geo,mat); pts.frustumCulled=false; scene.add(pts);
  return {geo,pts,p:Array.from({length:n},()=>({life:Math.random(),dur:1}))};
}
const SYS_SMOKE= mk(380, TEX_S, THREE.NormalBlending);

const OX=0, OZ=-0.7; let OY=1.17;      // 기름 표면 (냄비 스케일에 따라 갱신)
let stage=0, fireScale=1, power=1;

function spSmoke(o){
  const lift = stage===2 ? 0.42+0.40*fireScale : 0.04;   // 발화 시엔 화염 위에서 발생
  const a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*0.25;
  o.x=OX+Math.cos(a)*r; o.z=OZ+Math.sin(a)*r; o.y=OY+lift+Math.random()*0.12;
  o.vy=0.40+Math.random()*0.36; o.vx=(Math.random()-0.5)*0.18; o.vz=(Math.random()-0.5)*0.16;
  o.dur=1.7+Math.random()*1.5; o.life=0; o.seed=Math.random()*10; o.s=0.7+Math.random()*1.0;
}

SYS_SMOKE.p.forEach(spSmoke);

function step(sys,kind,dt,t){
  const P=sys.geo.attributes.position.array, C=sys.geo.attributes.pcolor.array,
        S=sys.geo.attributes.psize.array,    A=sys.geo.attributes.palpha.array;
  const active = stage>=1;
  sys.p.forEach((o,i)=>{
    o.life+=dt;
    if(o.life>o.dur){ spSmoke(o); }
    if(!active){ A[i]=0; S[i]=0; P[i*3+1]=-99; return; }
    const f=o.life/o.dur;
    const tb=Math.sin(t*2.4+o.seed*3.1+f*5.2)*0.06*f + Math.sin(t*5.7+o.seed*1.7)*0.02;
    o.x+=(o.vx+tb)*dt; o.z+=o.vz*dt; o.y+=o.vy*dt;
    P[i*3]=o.x; P[i*3+1]=o.y; P[i*3+2]=o.z;
    const k=(stage===2?0.16:0.28)+0.10*(1-f);
    C[i*3]=k*1.00; C[i*3+1]=k*0.97; C[i*3+2]=k*0.95;
    A[i]=Math.min(1,f*3.0)*(1-f)*(stage===2?0.32:0.34);
    S[i]=o.s*(0.32+f*1.5)*(stage===2?0.26:0.30);
  });
  ['position','pcolor','psize','palpha'].forEach(k=>sys.geo.attributes[k].needsUpdate=true);
}



// ---------- 실사 화염 스프라이트 ----------
const NSPR = 4, sprites = [];
const SPEC = [                       // 큰 불꽃 1 + 보조 3 (깊이감)
  {sc:1.00, dx: 0.00, dz: 0.00, ph:0,  op:0.98},
  {sc:0.74, dx:-0.11, dz: 0.07, ph:5,  op:0.82},
  {sc:0.66, dx: 0.12, dz:-0.05, ph:9,  op:0.78},
  {sc:0.52, dx: 0.02, dz: 0.10, ph:13, op:0.70},
];
for (let i=0;i<NSPR;i++){
  const tex = newAtlasTex(); tex.offset.set(0,0);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false,
    depthTest:true, opacity:1, blending:THREE.NormalBlending});
  const sp = new THREE.Sprite(mat); sp.renderOrder = 5+i; scene.add(sp);
  sprites.push({sp, tex, mat, ...SPEC[i]});
}
const SEQ_FPS = 11;                  // 초당 프레임 교체 수
function stepFlames(t){
  const on = (stage===2 && FLAMEMODE==='atlas');
  sprites.forEach((o,i)=>{
    o.sp.visible = on; if(!on) return;
    const cell = (Math.floor(t*SEQ_FPS) + o.ph) % 16;      // 같은 불꽃을 순서대로
    o.tex.offset.set((cell%4)*0.25, 0.75-Math.floor(cell/4)*0.25);
    const fs = Math.min(fireScale, 1.7);          // 하드 상한
    const h = 0.95*o.sc*(0.26+fs*0.38)*potScale;
    o.sp.scale.set(h*0.86, h, 1);
    const wob = Math.sin(t*2.2+i*2.1)*0.012;
    o.sp.position.set(OX+o.dx*potScale+wob, OY+h*0.46, OZ+o.dz*potScale);    // 밑동을 기름 표면에
    o.mat.opacity = o.op;
  });
}


// ---------- 절차적 화염 (실사 픽셀 0장 · 노이즈 생성) ----------
const FLAME_VS = `
varying vec2 vUv;
void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const FLAME_FS = `
precision highp float;
varying vec2 vUv;
uniform float uTime, uSeed, uOpacity;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),
             mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x), u.y);
}
float fbm(vec2 p){
  float a=0.5, s=0.0;
  for(int k=0;k<5;k++){ s+=a*vnoise(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; }
  return s;
}
void main(){
  float x = vUv.x*2.0-1.0;
  float y = vUv.y;
  float t = uTime;
  vec2 p = vec2(x*3.6, y*1.5 - t*2.0) + uSeed*3.3;
  vec2 w = vec2(fbm(p*0.9 - vec2(0.0,t*0.8)),
                fbm(p*0.9 + vec2(5.2,1.3) - vec2(0.0,t*0.7)));
  float turb = fbm(p + (w-0.5)*2.2);
  turb = mix(turb, fbm(p*2.7 - vec2(0.0,t*2.6)), 0.45);
  turb = pow(clamp(turb,0.0,1.0), 1.15);
  float width = mix(0.86, 0.30, pow(y,0.80));
  float sway  = (fbm(vec2(uSeed*3.1+11.0, y*2.0 - t*1.1))-0.5)*0.62*pow(y,1.5);
  float r = abs(x-sway)/max(0.05,width);
  float body = smoothstep(1.05, 0.10, r);
  float top  = smoothstep(1.06, 0.52, y);
  float bot  = smoothstep(-0.04, 0.14, y);
  float shape = body*top*bot;
  float erode = mix(0.60, 1.85, pow(y,0.62));
  float d = shape - turb*erode;
  float a = smoothstep(0.0, 0.16, d);
  if(a<0.012) discard;
  float heat = clamp(d*1.15 + 0.10 - y*0.62, 0.0, 1.0);
  vec3 col = vec3(0.88,0.185,0.025);
  col = mix(col, vec3(0.97,0.30,0.030), smoothstep(0.02,0.24,heat));
  col = mix(col, vec3(1.00,0.46,0.050), smoothstep(0.20,0.48,heat));
  col = mix(col, vec3(1.00,0.72,0.150), smoothstep(0.46,0.74,heat));
  col = mix(col, vec3(1.00,0.90,0.480), smoothstep(0.80,0.98,heat));
  col *= mix(1.0, 0.86, smoothstep(0.60,1.0,y));
  a *= mix(1.0, 0.26, smoothstep(0.48,0.96,y));
  a *= 0.55 + 0.45*smoothstep(0.0,0.20,heat);
  gl_FragColor = vec4(col, a*uOpacity);
}`;
let FLAMEMODE = 'proc';                    // 'proc' | 'atlas'
const PSPEC = [
  {sc:1.00, dx: 0.00, dz: 0.00, seed:0.0, op:1.00},
  {sc:0.80, dx:-0.10, dz: 0.06, seed:2.7, op:0.86},
  {sc:0.64, dx: 0.10, dz:-0.05, seed:5.9, op:0.76},
];
const procFlames = PSPEC.map((o,i)=>{
  const mat = new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}, uSeed:{value:o.seed}, uOpacity:{value:o.op}},
    vertexShader:FLAME_VS, fragmentShader:FLAME_FS,
    transparent:true, depthWrite:false, depthTest:true,
    blending:THREE.NormalBlending, side:THREE.DoubleSide});
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1,1), mat);
  m.renderOrder = 5+i; m.visible=false; scene.add(m);
  return {m, mat, ...o};
});
function stepProc(t){
  const on = (stage===2 && FLAMEMODE==='proc');
  procFlames.forEach((o,i)=>{
    o.m.visible = on; if(!on) return;
    const fs = Math.min(fireScale, 1.7);
    const h = 0.95*o.sc*(0.26+fs*0.38)*potScale;
    o.m.scale.set(h*0.86, h, 1);
    o.m.position.set(OX+o.dx*potScale, OY+h*0.48, OZ+o.dz*potScale);
    o.m.rotation.y = Math.atan2(camera.position.x-o.m.position.x,
                                camera.position.z-o.m.position.z);
    o.mat.uniforms.uTime.value = t + i*4.7;
  });
}

// ---------- 카메라 · 루프 ----------
function place(){
  const az=+document.getElementById('az').value*Math.PI/180,
        el=+document.getElementById('el').value*Math.PI/180,
        di=+document.getElementById('di').value;
  camera.position.set(Math.sin(az)*Math.cos(el)*di, 1.15+Math.sin(el)*di, OZ+Math.cos(az)*Math.cos(el)*di);
  camera.lookAt(0,1.16,OZ);
}
let last=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(), dt=Math.min(0.05,(now-last)/1000); last=now; const t=now/1000;
  step(SYS_SMOKE,'smoke',dt,t); stepFlames(t); stepProc(t);
  const fl=0.82+0.18*Math.sin(t*11.3)+0.10*Math.sin(t*23.7);
  fireLight.intensity = stage===2 ? 2.4*fireScale*fl : 0;
  const hp = 0.16 + 0.16*power + (stage===1?0.20:0) + (stage===2?0.34:0);
  heatMat.emissive.setRGB(hp*0.85, hp*0.16, hp*0.05);
  leds.forEach((m,i)=>{ m.emissiveIntensity = (i<Math.ceil(power*2.2) ? 1.15 : 0.12)
                        * (0.94+0.06*Math.sin(t*6+i)); });
  const e = stage===2 ? 0.16*Math.min(1.3,fireScale)*fl : (stage===1 ? 0.03 : 0);
  oilMat.emissive.setRGB(e, e*0.36, 0);
  const li=+document.getElementById('li').value;
  hemi.intensity=0.40*li; key.intensity=0.62*li; fill.intensity=0.24*li;
  place(); renderer.render(scene,camera);
}
loop();

// ---------- UI ----------
const bind=(id,f)=>{const e=document.getElementById(id),o=document.getElementById('v-'+id);
  const u=()=>o.textContent=f(+e.value); e.addEventListener('input',u); u();};
bind('fire',v=>v.toFixed(2)); bind('gas',v=>v.toFixed(2)); bind('az',v=>v+'°');
bind('el',v=>v+'°'); bind('di',v=>v.toFixed(2)); bind('li',v=>v.toFixed(2));
document.getElementById('fire').addEventListener('input',e=>fireScale=+e.target.value);
document.getElementById('gas').addEventListener('input',e=>power=+e.target.value);

const NOTES=['인덕션 가열 중, 불꽃 없음. 제어판 LED를 화재로 잡으면 오탐.',
             '기름이 과열돼 연기가 오르는 상태. 화재 직전 단계.',
             '기름에 불이 붙은 상태. 이걸 잡아야 정탐.'];
function setStage(s){ stage=s; document.getElementById('note').textContent=NOTES[s];
  [0,1,2].forEach(i=>document.getElementById('s'+i).className = i===s?'on':''); }
[0,1,2].forEach(i=>document.getElementById('s'+i).onclick=()=>{ setStage(i); log('단계 → '+NOTES[i].split('.')[0]); });


// ---------- 정답 박스 추출 (화염만 렌더 → 밝은 화소의 외접 박스) ----------
const mcan = document.createElement('canvas'); mcan.width=W; mcan.height=H;
const mctx = mcan.getContext('2d', {willReadFrequently:true});
function gtBox(){
  const flameSet = new Set();
  procFlames.forEach(o=>flameSet.add(o.m));
  sprites.forEach(o=>flameSet.add(o.sp));
  const saved = [];
  scene.traverse(o=>{ if(o.isMesh||o.isPoints||o.isSprite){ saved.push([o,o.visible]);
                      if(!flameSet.has(o)) o.visible=false; } });
  const bg = scene.background;
  scene.background = new THREE.Color(0x000000);
  const fi = fireLight.intensity; fireLight.intensity = 0;
  renderer.render(scene,camera);
  mctx.drawImage(renderer.domElement,0,0);
  const d = mctx.getImageData(0,0,W,H).data;
  let x0=1e9,y0=1e9,x1=-1,y1=-1,n=0;
  for(let y=0;y<H;y++){ for(let x=0;x<W;x++){
    const i=(y*W+x)*4;
    if(d[i]*0.30+d[i+1]*0.60+d[i+2]*0.10 > 26){
      n++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } } }
  saved.forEach(([o,v])=>o.visible=v);
  scene.background = bg; fireLight.intensity = fi;
  renderer.render(scene,camera);
  return n>60 ? [x0,y0,x1,y1,n] : null;
}

const shot=()=>renderer.domElement.toDataURL('image/jpeg',0.92).split(',')[1];
document.getElementById('cap').onclick=()=>{ const a=document.createElement('a');
  a.href='data:image/jpeg;base64,'+shot(); a.download='shot_'+Date.now()+'.jpg'; a.click(); log('1장 캡처'); };

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
let RND = Math.random;
const R=(a,b)=>a+RND()*(b-a);

// ---- 씬 랜덤화 ----
function setPotScale(sc){
  potScale = sc; potGroup.scale.setScalar(sc);
  OY = POT_PIVOT_Y + (1.17-POT_PIVOT_Y)*sc;
  fireLight.position.set(OX, OY+0.28, OZ);
}
function randomizeScene(){
  const g = 0.74+R(0,0.26);
  wall.material.color.setRGB(g*(0.94+R(0,0.10)), g*(0.95+R(0,0.08)), g*(0.92+R(0,0.12)));
  wallMat2.color.setRGB(g*(0.93+R(0,0.11)), g*(0.94+R(0,0.09)), g*(0.91+R(0,0.13)));
  const cg = 0.52+R(0,0.44);
  counter.material.color.setRGB(cg*0.98, cg, cg*1.02);
  cTop.material.color.setRGB(Math.min(1,cg*1.14), Math.min(1,cg*1.16), Math.min(1,cg*1.18));
  if (R(0,1)<0.35){ potMat.color.setHex(0x54585c); potMat.metalness=0.55; potMat.roughness=0.52; }
  else           { potMat.color.setHex(0xc4c8cc); potMat.metalness=0.72; potMat.roughness=0.28; }
  oilMat.color.setRGB(0.64+R(0,0.18), 0.50+R(0,0.16), 0.12+R(0,0.12));
  setPotScale(0.86+R(0,0.30));
  const w=R(0,1);
  key.color.setRGB(1.0, 0.88+w*0.10, 0.74+w*0.24);
  hemi.color.setRGB(0.85+R(0,0.13), 0.87+R(0,0.11), 0.89+R(0,0.11));
  clutter.forEach(m=> m.visible = R(0,1)<0.45);
  scene.background.setRGB(0.78+R(0,0.14), 0.78+R(0,0.14), 0.77+R(0,0.14));
}
const setv=(id,v)=>{const e=document.getElementById(id); e.value=v; e.dispatchEvent(new Event('input'));};
const wait=n=>new Promise(r=>{let k=0;const f=()=>{ ++k>=n ? r() : requestAnimationFrame(f); };requestAnimationFrame(f);});
function randomView(){ setv('az',Math.round(R(-78,78))); setv('el',Math.round(R(5,55)));
  setv('di',R(1.6,4.6).toFixed(2)); setv('li',R(0.35,1.65).toFixed(2)); }

document.getElementById('auto').onclick=async ev=>{
  const btn=ev.target; btn.disabled=true;
  RND = mulberry32(20260804);          // 두 모드가 완전히 같은 씬·구도를 보도록 고정 시드
  const zip=new JSZip(), F=zip.folder('fire'), S=zip.folder('smoke'), N=zip.folder('normal');
  const GTS = {}; let gtMiss = 0;
  const NF=100, NS=20, NN=30;
  log('자동 캡처 시작 — '+(FLAMEMODE==='proc'?'절차적 화염':'실사 아틀라스'));
  for(let i=0;i<NF;i++){ setStage(2); randomizeScene();
    setv('fire',R(0.40,1.70).toFixed(2)); setv('gas',R(0.4,1.7).toFixed(2));
    fireScale=+document.getElementById('fire').value;
    power=+document.getElementById('gas').value; randomView(); await wait(26);
    const fn = `fire_${String(i).padStart(3,'0')}.jpg`;
    const gb = gtBox(); if(gb) GTS[fn]=gb.slice(0,4); else gtMiss++;
    F.file(fn, shot(), {base64:true});
    if(i%25===24) log(`발화 ${i+1}/${NF}`); }
  for(let i=0;i<NS;i++){ setStage(1); randomizeScene();
    setv('gas',R(0.6,1.75).toFixed(2)); power=+document.getElementById('gas').value;
    randomView(); await wait(30);
    S.file(`smoke_${String(i).padStart(3,'0')}.jpg`, shot(), {base64:true}); }
  log(`연기 ${NS}/${NS}`);
  for(let i=0;i<NN;i++){ setStage(0); randomizeScene();
    setv('gas',R(0.3,1.75).toFixed(2)); power=+document.getElementById('gas').value;
    randomView(); await wait(16);
    N.file(`normal_${String(i).padStart(3,'0')}.jpg`, shot(), {base64:true}); }
  zip.file('labels.json', JSON.stringify({mode:FLAMEMODE, w:W, h:H, boxes:GTS}, null, 1));
  log(`정답 박스 ${Object.keys(GTS).length}/${NF}${gtMiss?(' · 추출 실패 '+gtMiss):''}`);
  log('정상 '+NN+'/'+NN+' · 압축 중…');
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = (FLAMEMODE==='proc' ? 'web3d_proc.zip' : 'web3d_atlas.zip'); a.click();
  RND = Math.random; setStage(0); btn.disabled=false;
  log('완료 — '+a.download+` (발화 ${NF} · 연기 ${NS} · 정상 ${NN})`);
};

// ---- 화염 소스 토글 ----
function setMode(m){ FLAMEMODE=m;
  document.getElementById('m0').className = m==='proc'?'on':'';
  document.getElementById('m1').className = m==='atlas'?'on':'';
  document.getElementById('mnote').textContent = m==='proc'
    ? '노이즈로 생성한 화염. 실사 픽셀 0장 — 학습 데이터와 생성 경로가 다름.'
    : '실사 화염 영상에서 뽑은 아틀라스. 학습에 쓴 화염 소재와 같은 계열.';
  document.getElementById('auto').textContent = (m==='proc'?'자동 캡처 — 절차적':'자동 캡처 — 아틀라스')+' 100·20·30';
}
document.getElementById('m0').onclick=()=>setMode('proc');
document.getElementById('m1').onclick=()=>setMode('atlas');
document.getElementById('rnd').onclick=()=>{ randomizeScene(); log('씬 무작위화'); };
setMode('proc');

} catch(e){ showErr('초기화 중단: ' + (e && e.stack ? e.stack : e)); }
</script>
